# .github/workflows/qa-automation.yml
name: QA Automation Pipeline

on:
  push:
    branches: [ main, integration ]

  workflow_dispatch: # Allow manual trigger

jobs:
  # Job 1: API Testing with Postman/Newman
  api-tests:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm install
      
    - name: Start API server
      run: |
        cd backend
        npm start &
        echo $! > ../server.pid
      env:
        NODE_ENV: test
        
    - name: Wait for server to start
      run: |
        echo "Waiting for server to start..."
        timeout 60 bash -c 'until curl -f http://localhost:5000/health; do sleep 2; done'
        echo "Server is ready!"
        
    - name: Install Newman
      run: npm install -g newman
      
    - name: Run API tests with Newman
      run: newman run backend/postman/task-management-api.postman_collection.json --reporter-cli,json --reporter-json-export newman-report.json
      
    - name: Generate Newman HTML report
      run: |
        npm install -g newman-reporter-htmlextra
        newman run backend/postman/task-management-api.postman_collection.json \
          -r htmlextra --reporter-htmlextra-export api-test-report.html \
          --reporter-htmlextra-title "Task Management API Test Report"
      
    - name: Upload Newman reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-reports
        path: |
          newman-report.json
          api-test-report.html
        
    - name: Stop server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
          rm server.pid
        fi

  # Job 2: UI Tests with Playwright
  ui-tests:
    name: UI Automation Tests (Playwright)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm install
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
      
    - name: Install Playwright browsers
      run: |
        cd frontend
        npx playwright install --with-deps
      
    - name: Build React app
      run: |
        cd frontend
        npm run build
        
    - name: Start servers
      run: |
        # Start API server
        cd backend
        npm start &
        echo $! > ../api-server.pid
        cd ..
        
        # Start React app
        cd frontend
        npm start &
        echo $! > ../react-server.pid
        cd ..
      env:
        NODE_ENV: test
        CI: true
        
    - name: Wait for servers
      run: |
        echo "Waiting for API server..."
        timeout 60 bash -c 'until curl -f http://localhost:5000/health; do sleep 2; done'
        
        echo "Waiting for React app..."
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
        
        echo "Both servers are ready!"
        
    - name: Run Playwright tests
      run: |
        cd frontend
        npx playwright test
      env:
        CI: true
        
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        
    - name: Stop servers
      if: always()
      run: |
        if [ -f api-server.pid ]; then
          kill $(cat api-server.pid) || true
          rm api-server.pid
        fi
        if [ -f react-server.pid ]; then
          kill $(cat react-server.pid) || true
          rm react-server.pid
        fi

  # Job 3: Security & Quality Checks
  security-checks:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd backend && npm install
        cd ../frontend && npm install
      
    - name: Run backend security audit
      run: |
        cd backend
        npm audit --audit-level=high
      continue-on-error: true
      
    - name: Run frontend security audit
      run: |
        cd frontend
        npm audit --audit-level=high
      continue-on-error: true
      
    - name: Check for outdated packages (backend)
      run: |
        cd backend
        npm outdated || true
      continue-on-error: true
      
    - name: Check for outdated packages (frontend)
      run: |
        cd frontend
        npm outdated || true
      continue-on-error: true

  # Job 4: Test Report Generation
  generate-reports:
    name: Generate Test Reports
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Generate comprehensive report
      run: |
        mkdir -p reports
        
        # Copy API test reports
        if [ -d api-test-reports ]; then
          cp api-test-reports/*.html reports/ 2>/dev/null || true
          cp api-test-reports/*.json reports/ 2>/dev/null || true
        fi
        
        # Copy Playwright report
        if [ -d playwright-report ]; then
          cp -r playwright-report reports/ui-tests
        fi
        
        # Create comprehensive index page
        cat > reports/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>QA Test Reports Dashboard</title>
            <style>
                body { 
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                    margin: 0; 
                    padding: 20px;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                }
                .container { 
                    max-width: 1200px; 
                    margin: 0 auto; 
                    background: white; 
                    border-radius: 10px; 
                    padding: 30px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                }
                h1 { 
                    color: #333; 
                    text-align: center; 
                    margin-bottom: 40px;
                    font-size: 2.5em;
                }
                .report-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                    gap: 20px;
                    margin-top: 30px;
                }
                .report-card { 
                    border: 1px solid #e0e0e0; 
                    padding: 25px; 
                    border-radius: 12px; 
                    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                    transition: transform 0.3s ease, box-shadow 0.3s ease;
                }
                .report-card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
                }
                .report-card h2 { 
                    color: #333; 
                    margin-top: 0;
                    font-size: 1.4em;
                }
                .report-card p {
                    color: #666;
                    line-height: 1.6;
                }
                .report-card a { 
                    color: #4a90e2; 
                    text-decoration: none; 
                    font-weight: 600;
                    display: inline-block;
                    margin-top: 10px;
                    padding: 8px 16px;
                    border: 2px solid #4a90e2;
                    border-radius: 5px;
                    transition: all 0.3s ease;
                }
                .report-card a:hover { 
                    background: #4a90e2;
                    color: white;
                }
                .status-badge {
                    display: inline-block;
                    padding: 4px 12px;
                    border-radius: 20px;
                    font-size: 0.8em;
                    font-weight: bold;
                    margin-left: 10px;
                }
                .status-success { background: #d4edda; color: #155724; }
                .status-info { background: #cce7ff; color: #004085; }
                .footer {
                    text-align: center;
                    margin-top: 40px;
                    padding-top: 20px;
                    border-top: 1px solid #eee;
                    color: #666;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>🚀 QA Automation Test Reports</h1>
                <p style="text-align: center; font-size: 1.1em; color: #666;">
                    Comprehensive testing results for Task Management Application
                </p>
                
                <div class="report-grid">
                    <div class="report-card">
                        <h2>🔌 API Test Results <span class="status-badge status-success">Newman</span></h2>
                        <p>Complete API endpoint testing using Postman collections executed via Newman. 
                           Covers authentication, CRUD operations, error handling, and security validation.</p>
                        <a href="api-test-report.html">View API Test Report</a>
                    </div>
                    
                    <div class="report-card">
                        <h2>🖥️ UI Automation Results <span class="status-badge status-info">Playwright</span></h2>
                        <p>End-to-end user interface testing across multiple browsers. 
                           Tests user workflows including login, task management, and data validation.</p>
                        <a href="ui-tests/index.html">View UI Test Report</a>
                    </div>
                    
                    <div class="report-card">
                        <h2>📊 Test Summary</h2>
                        <p>Combined results from all test suites providing comprehensive coverage 
                           of both backend API functionality and frontend user experience.</p>
                        <div style="margin-top: 15px;">
                            <strong>Coverage Areas:</strong>
                            <ul style="margin: 10px 0; padding-left: 20px;">
                                <li>Authentication & Authorization</li>
                                <li>CRUD Operations</li>
                                <li>User Interface Workflows</li>
                                <li>Cross-browser Compatibility</li>
                                <li>Error Handling</li>
                                <li>Security Validation</li>
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="footer">
                    <p>Generated by GitHub Actions CI/CD Pipeline | 
                       <strong>Latest Run:</strong> <span id="timestamp"></span>
                    </p>
                </div>
            </div>
            
            <script>
                document.getElementById('timestamp').textContent = new Date().toLocaleString();
            </script>
        </body>
        </html>
        EOF
        
    - name: Upload combined reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: reports/
        
    - name: Deploy reports to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        destination_dir: test-reports

  # Job 5: Notify Results
  notify:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests, security-checks]
    if: always()
    
    steps:
    - name: Calculate test results
      id: results
      run: |
        api_result="${{ needs.api-tests.result }}"
        ui_result="${{ needs.ui-tests.result }}"
        security_result="${{ needs.security-checks.result }}"
        
        echo "api_result=$api_result" >> $GITHUB_OUTPUT
        echo "ui_result=$ui_result" >> $GITHUB_OUTPUT
        echo "security_result=$security_result" >> $GITHUB_OUTPUT
        
        if [[ "$api_result" == "success" && "$ui_result" == "success" ]]; then
          echo "overall_result=success" >> $GITHUB_OUTPUT
        else
          echo "overall_result=failure" >> $GITHUB_OUTPUT
        fi
        
    - name: Notify success
      if: steps.results.outputs.overall_result == 'success'
      run: |
        echo " All tests passed successfully!"
        echo " API Tests (Newman): ${{ steps.results.outputs.api_result }}"
        echo " UI Tests (Playwright): ${{ steps.results.outputs.ui_result }}"
        echo " Security Checks: ${{ steps.results.outputs.security_result }}"
        echo ""
        echo " Your QA automation pipeline is working perfectly!"
        
    - name: Notify failure
      if: steps.results.outputs.overall_result == 'failure'
      run: |
        echo " Some tests failed!"
        echo " API Tests (Newman): ${{ steps.results.outputs.api_result }}"
        echo " UI Tests (Playwright): ${{ steps.results.outputs.ui_result }}"
        echo " Security Checks: ${{ steps.results.outputs.security_result }}"
        echo ""
        echo "Please check the individual job logs for details."
        exit 1